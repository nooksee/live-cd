[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liveusb-creator"
version = "3.13.57"
description = "LiveUSB Creator 3 - advanced LiveUSB customization and remastering tool (Python port)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "Kevin Atwood" },
    { name = "Ivailo Monev" },
]

[project.optional-dependencies]
gui = ["PyGObject"]

[project.scripts]
live-usb = "liveusb.cli:main"

[project.gui-scripts]
live-usb-gui = "liveusb.gui.app:main"

[tool.setuptools.packages.find]
include = ["liveusb", "liveusb.*"]
