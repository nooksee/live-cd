[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liveusb-creator"
dynamic = ["version"]
description = "Advanced Ubuntu LiveUSB customization and remastering tool"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "Kevin Thomas" },
    { name = "Ivailo Monev" },
]
maintainers = [
    { name = "Kevin Thomas" },
]

[project.optional-dependencies]
gui = ["PyGObject"]

[project.scripts]
live-usb = "liveusb.cli:main"

[project.gui-scripts]
live-usb-gui = "liveusb.gui.app:main"

[tool.setuptools.packages.find]
include = ["liveusb", "liveusb.*"]

[tool.setuptools.dynamic]
version = { attr = "liveusb.__version__" }
